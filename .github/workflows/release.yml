name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require a stable semantic version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must match vMAJOR.MINOR.PATCH"
            exit 1
          fi

  ui:
    name: Build UI assets
    needs: release-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        working-directory: ui
        run: npm ci && npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: release-ui-dist
          path: ui/dist
          if-no-files-found: error

  native-binaries:
    name: Build ${{ matrix.name }}
    needs: ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            expected_arch: x86_64
            cgo: "1"
            cc: gcc
            archive: minisky_linux_amd64.tar.gz
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            expected_arch: aarch64
            cgo: "1"
            cc: gcc
            archive: minisky_linux_arm64.tar.gz
          - name: darwin-arm64
            runner: macos-14
            expected_arch: arm64
            cgo: "1"
            cc: clang
            archive: minisky_darwin_arm64.tar.gz
          - name: windows-amd64
            runner: windows-latest
            expected_arch: amd64
            cgo: "1"
            cc: gcc
            archive: minisky_windows_amd64.zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: release-ui-dist
          path: ui/dist

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add UCRT toolchain to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH 'C:\msys64\ucrt64\bin'

      - name: Verify Unix runner architecture
        if: runner.os != 'Windows'
        run: test "$(uname -m)" = "${{ matrix.expected_arch }}"

      - name: Verify Windows runner architecture
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ((go env GOARCH) -ne '${{ matrix.expected_arch }}') {
            throw "Unexpected architecture: $(go env GOARCH)"
          }

      - name: Run platform contract tests
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          CC: ${{ matrix.cc }}
        run: go test -count=1 ./pkg/shims/bigquery

      - name: Build and package Unix binary
        if: runner.os != 'Windows'
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          CC: ${{ matrix.cc }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir package
          go build -trimpath \
            -ldflags "-s -w -X minisky/pkg/version.Version=${version}" \
            -o package/minisky ./cmd/minisky
          cp README.md CONTRIBUTING.md LICENSE package/
          cp -R docs package/
          tar -C package -czf "${{ matrix.archive }}" \
            minisky README.md CONTRIBUTING.md LICENSE docs
          mkdir installed
          tar -C installed -xzf "${{ matrix.archive }}"
          ./installed/minisky doctor bigquery

      - name: Build and package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          CC: ${{ matrix.cc }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          New-Item -ItemType Directory package
          go build -trimpath `
            -ldflags "-s -w -X minisky/pkg/version.Version=$version" `
            -o package\minisky.exe ./cmd/minisky
          Copy-Item README.md, CONTRIBUTING.md, LICENSE package\
          Copy-Item -Recurse docs package\
          Compress-Archive -Path package\* -DestinationPath "${{ matrix.archive }}"
          New-Item -ItemType Directory installed
          Expand-Archive -Path "${{ matrix.archive }}" -DestinationPath installed
          .\installed\minisky.exe doctor bigquery

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.name }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish checksummed release
    needs: native-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: release-assets
          merge-multiple: true

      - name: Validate native artifact set
        run: |
          set -euo pipefail
          artifacts=(
            minisky_linux_amd64.tar.gz
            minisky_linux_arm64.tar.gz
            minisky_darwin_arm64.tar.gz
            minisky_windows_amd64.zip
          )
          required_files=(
            README.md
            CONTRIBUTING.md
            LICENSE
            docs/cli_reference.md
          )

          for artifact in "${artifacts[@]}"; do
            archive="release-assets/${artifact}"
            test -s "${archive}"

            if [[ "${artifact}" == *.tar.gz ]]; then
              mapfile -t contents < <(tar -tzf "${archive}")
              required_binary=minisky
            else
              mapfile -t contents < <(unzip -Z1 "${archive}")
              required_binary=minisky.exe
            fi

            if printf '%s\n' "${contents[@]}" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
              echo "::error file=${archive}::Archive contains an unsafe path"
              exit 1
            fi

            for required in "${required_binary}" "${required_files[@]}"; do
              if ! printf '%s\n' "${contents[@]}" | grep -Fqx "${required}"; then
                echo "::error file=${archive}::Missing required package entry: ${required}"
                exit 1
              fi
            done
          done

          cd release-assets
          sha256sum "${artifacts[@]}" > checksums.txt
          test "$(wc -l < checksums.txt)" -eq "${#artifacts[@]}"
          sha256sum --check --strict checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "MiniSky ${GITHUB_REF_NAME}"

  container-smoke:
    name: Smoke test container (${{ matrix.platform }})
    needs: release-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            cache_scope: container-amd64
            image_tag: minisky-smoke-amd64
          - platform: linux/arm64
            cache_scope: container-arm64
            image_tag: minisky-smoke-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: ${{ matrix.image_tag }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Run container conformance check
        run: |
          docker run --rm --entrypoint /app/minisky "${{ matrix.image_tag }}" version
          docker run --rm --entrypoint /app/minisky "${{ matrix.image_tag }}" doctor bigquery

  container-publish:
    name: Publish multi-architecture container
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - container-smoke
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Resolve lowercase image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and publish multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=container-amd64
            type=gha,scope=container-arm64
          cache-to: type=gha,mode=max,scope=container-release
