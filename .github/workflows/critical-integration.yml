name: Critical integration evidence

on:
  schedule:
    - cron: "23 5 * * 1"
  pull_request:
    paths:
      - ".github/workflows/critical-integration.yml"
      - ".github/workflows/ci.yml"
      - "cmd/minisky/**"
      - "pkg/orchestrator/**"
      - "pkg/router/**"
      - "pkg/shims/**"
      - "pkg/state/**"
      - "pkg/config/images.json"
      - "scripts/storage-persistence-pubsub-session-integration.sh"
      - "scripts/emulator_data_durability_contract_test.go"
      - "scripts/cloudsql_restart_contract_test.go"
      - "scripts/state-durability-integration.sh"
      - "scripts/kind-integration.sh"
      - "scripts/terraform-integration.sh"
      - "scripts/event-delivery-integration.sh"
      - "scripts/install-pack.sh"
      - "scripts/memcache-integration.sh"
      - "scripts/memcache_ci_workflow_contract_test.go"
      - "scripts/phase10-artifact-integration.sh"
      - "scripts/phase13-wif-integration.sh"
      - "scripts/phase15-emulator-integration.sh"
      - "scripts/phase16-monitoring-integration.sh"
      - "scripts/phase16-logging-integration.sh"
      - "scripts/phase16-dns-integration.sh"
      - "scripts/phase16-vertex-integration.sh"
      - "scripts/phase16-subnetwork-integration.sh"
      - "scripts/phase16-subnetwork-terraform-integration.sh"
      - "scripts/phase17-enterprise-wif-integration.sh"
      - "sdk-smoke/**"
      - "terraform/**"
      - "terraform/memcache/**"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "ui/package-lock.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/critical-integration.yml"
      - ".github/workflows/ci.yml"
      - "cmd/minisky/**"
      - "pkg/orchestrator/**"
      - "pkg/router/**"
      - "pkg/shims/**"
      - "pkg/state/**"
      - "pkg/config/images.json"
      - "scripts/storage-persistence-pubsub-session-integration.sh"
      - "scripts/emulator_data_durability_contract_test.go"
      - "scripts/cloudsql_restart_contract_test.go"
      - "scripts/state-durability-integration.sh"
      - "scripts/kind-integration.sh"
      - "scripts/terraform-integration.sh"
      - "scripts/event-delivery-integration.sh"
      - "scripts/install-pack.sh"
      - "scripts/memcache-integration.sh"
      - "scripts/memcache_ci_workflow_contract_test.go"
      - "scripts/phase10-artifact-integration.sh"
      - "scripts/phase13-wif-integration.sh"
      - "scripts/phase15-emulator-integration.sh"
      - "scripts/phase16-monitoring-integration.sh"
      - "scripts/phase16-logging-integration.sh"
      - "scripts/phase16-dns-integration.sh"
      - "scripts/phase16-vertex-integration.sh"
      - "scripts/phase16-subnetwork-integration.sh"
      - "scripts/phase16-subnetwork-terraform-integration.sh"
      - "scripts/phase17-enterprise-wif-integration.sh"
      - "sdk-smoke/**"
      - "terraform/**"
      - "terraform/memcache/**"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "ui/package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: critical-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Build integration assets
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI from lockfile
        working-directory: ui
        run: npm ci && npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: critical-integration-ui-dist
          path: ui/dist
          if-no-files-found: error

  terraform-provider:
    name: Critical Terraform provider lifecycle
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: critical-integration-ui-dist
          path: ui/dist

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.8"

      - name: Run guarded Terraform provider lifecycle
        env:
          MINISKY_TERRAFORM_INTEGRATION: "1"
          MINISKY_TERRAFORM_CLOUDSQL: "1"
          MINISKY_TERRAFORM_GKE: "1"
          MINISKY_TERRAFORM_JAVA_SMOKE: "1"
          MINISKY_TERRAFORM_PHASE15: "1"
        run: ./scripts/terraform-integration.sh

  state-durability:
    name: Critical state durability lifecycle
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: critical-integration-ui-dist
          path: ui/dist

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.8"

      - name: Run guarded state durability lifecycle
        env:
          MINISKY_STATE_DURABILITY_INTEGRATION: "1"
        run: ./scripts/state-durability-integration.sh

  cloudsql-restart-integration:
    name: cloudsql-restart-integration
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify Docker availability
        run: docker info >/dev/null

      - name: Run guarded Cloud SQL restart integration
        run: make test-cloudsql-restart-integration

  kind-lifecycle:
    name: Critical Kind lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify Docker availability
        run: docker info >/dev/null

      - name: Run pinned isolated Kind lifecycle
        env:
          MINISKY_KIND_INTEGRATION: "1"
          MINISKY_KIND_CLUSTER: minisky-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: ./scripts/kind-integration.sh

  event-delivery:
    name: Critical Phase 9 event delivery
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: critical-integration-ui-dist
          path: ui/dist

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install checksum-verified Pack v0.40.8
        run: |
          ./scripts/install-pack.sh
          echo "${HOME}/.minisky/bin" >>"${GITHUB_PATH}"

      - name: Verify Docker availability
        run: docker info >/dev/null

      - name: Run guarded event delivery lifecycle
        run: |
          set -o pipefail
          make test-event-delivery 2>&1 | tee critical-phase9-event-delivery.log

      - name: Retain failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: critical-phase9-event-delivery-${{ github.run_id }}-${{ github.run_attempt }}
          path: critical-phase9-event-delivery.log
          if-no-files-found: error
          retention-days: 7

  artifact-registry:
    name: Critical Phase 10 Artifact Registry
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: critical-integration-ui-dist
          path: ui/dist

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify Docker availability
        run: docker info >/dev/null

      - name: Run guarded Artifact Registry lifecycle
        run: |
          set -o pipefail
          make test-phase10-artifact 2>&1 | tee critical-phase10-artifact.log

      - name: Retain failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: critical-phase10-artifact-${{ github.run_id }}-${{ github.run_attempt }}
          path: critical-phase10-artifact.log
          if-no-files-found: error
          retention-days: 7

  workload-identity:
    name: Critical Phase 13 workload identity
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: critical-integration-ui-dist
          path: ui/dist

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.8"

      - name: Verify Docker availability
        run: docker info >/dev/null

      - name: Run guarded workload identity lifecycle
        run: |
          set -o pipefail
          make test-phase13-wif 2>&1 | tee critical-phase13-wif.log

      - name: Retain failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: critical-phase13-wif-${{ github.run_id }}-${{ github.run_attempt }}
          path: critical-phase13-wif.log
          if-no-files-found: error
          retention-days: 7

  data-emulators:
    name: Critical Phase 15 data emulators
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: critical-integration-ui-dist
          path: ui/dist

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify Docker availability
        run: docker info >/dev/null

      - name: Run guarded emulator lifecycle
        env:
          MINISKY_PHASE15_INTEGRATION: "1"
        run: |
          set -o pipefail
          ./scripts/phase15-emulator-integration.sh 2>&1 | tee critical-phase15-emulators.log

      - name: Retain failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: critical-phase15-emulators-${{ github.run_id }}-${{ github.run_attempt }}
          path: critical-phase15-emulators.log
          if-no-files-found: error
          retention-days: 7

  phase16-service-lifecycles:
    name: Critical Phase 16 ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Monitoring
            target: test-phase16-monitoring
            log: critical-phase16-monitoring.log
          - name: Logging
            target: test-phase16-logging
            log: critical-phase16-logging.log
          - name: Cloud DNS
            target: test-phase16-dns
            log: critical-phase16-dns.log
          - name: Vertex AI
            target: test-phase16-vertex
            log: critical-phase16-vertex.log
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: critical-integration-ui-dist
          path: ui/dist

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run guarded service lifecycle
        env:
          MAKE_TARGET: ${{ matrix.target }}
          LOG_FILE: ${{ matrix.log }}
        run: |
          set -o pipefail
          make "${MAKE_TARGET}" 2>&1 | tee "${LOG_FILE}"

      - name: Retain failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: critical-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ matrix.log }}
          if-no-files-found: error
          retention-days: 7

  subnetwork-sdk:
    name: Critical Phase 16 subnetwork SDK
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: critical-integration-ui-dist
          path: ui/dist

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify Docker availability
        run: docker info >/dev/null

      - name: Run guarded subnetwork SDK lifecycle
        run: |
          set -o pipefail
          make test-phase16-subnetwork 2>&1 | tee critical-phase16-subnetwork-sdk.log

      - name: Retain failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: critical-phase16-subnetwork-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: critical-phase16-subnetwork-sdk.log
          if-no-files-found: error
          retention-days: 7

  subnetwork-terraform:
    name: Critical Phase 16 subnetwork Terraform
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: critical-integration-ui-dist
          path: ui/dist

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.8"

      - name: Verify Docker availability
        run: docker info >/dev/null

      - name: Run guarded subnetwork Terraform lifecycle
        run: |
          set -o pipefail
          make test-phase16-subnetwork-terraform 2>&1 | tee critical-phase16-subnetwork-terraform.log

      - name: Retain failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: critical-phase16-subnetwork-terraform-${{ github.run_id }}-${{ github.run_attempt }}
          path: critical-phase16-subnetwork-terraform.log
          if-no-files-found: error
          retention-days: 7

  storage-persistence-pubsub-session:
    name: Critical Storage persistence and PubSub session boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MINISKY_EMULATOR_BOUNDARY_PROFILE: emulator-boundary-${{ github.run_id }}-${{ github.run_attempt }}
      MINISKY_STORAGE_TEST_IMAGE: fsouza/fake-gcs-server:latest@sha256:91afded49de804aa61b5f3eb6c7cd65205acf9e5c5e047cf0ba7d9507af806c8
      MINISKY_PUBSUB_TEST_IMAGE: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators@sha256:f098583c0387cf0fe4c64068ed1e1cf0dbc73e04f0621642b9a7e1f8b26ca287

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI from lockfile
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify Docker availability
        run: docker info >/dev/null

      - name: Run guarded Storage persistence and PubSub session gate
        env:
          MINISKY_EMULATOR_BOUNDARY_DIAGNOSTICS_DIR: ${{ runner.temp }}/storage-persistence-pubsub-session-diagnostics
        run: |
          set -o pipefail
          mkdir -p "${MINISKY_EMULATOR_BOUNDARY_DIAGNOSTICS_DIR}"
          make test-storage-persistence-pubsub-session 2>&1 | tee critical-storage-persistence-pubsub-session.log

      - name: Capture Storage and PubSub boundary diagnostics
        if: ${{ failure() || cancelled() }}
        env:
          MINISKY_EMULATOR_BOUNDARY_DIAGNOSTICS_DIR: ${{ runner.temp }}/storage-persistence-pubsub-session-diagnostics
        run: |
          mkdir -p "${MINISKY_EMULATOR_BOUNDARY_DIAGNOSTICS_DIR}"
          {
            printf 'run_sha=%s\n' '${{ github.sha }}'
            printf 'profile=%s\n' "${MINISKY_EMULATOR_BOUNDARY_PROFILE}"
            docker version 2>&1 || true
            docker ps -a --format '{{.ID}} {{.Image}} {{.Names}} {{.Labels}}' 2>&1 || true
            docker network ls 2>&1 || true
            docker volume ls 2>&1 || true
          } >"${MINISKY_EMULATOR_BOUNDARY_DIAGNOSTICS_DIR}/ci-docker-inventory.txt"
          for diagnostic_profile in "${MINISKY_EMULATOR_BOUNDARY_PROFILE}" "${MINISKY_EMULATOR_BOUNDARY_PROFILE}-isolated"; do
            while IFS= read -r container; do
              test -n "${container}" || continue
              docker inspect "${container}" \
                >"${MINISKY_EMULATOR_BOUNDARY_DIAGNOSTICS_DIR}/ci-container-${container}-inspect.json" 2>&1 || true
              docker logs "${container}" \
                >"${MINISKY_EMULATOR_BOUNDARY_DIAGNOSTICS_DIR}/ci-container-${container}.log" 2>&1 || true
            done < <(docker ps -aq \
              --filter "label=managed-by=minisky" \
              --filter "label=minisky.profile=${diagnostic_profile}" 2>/dev/null || true)
          done

      - name: Clean exact-owned Storage and PubSub boundary resources
        if: always()
        timeout-minutes: 2
        run: |
          set -Eeuo pipefail
          cleanup_exact_profile() {
            local cleanup_profile="${1:?profile is required}"
            local inventory
            local resource
            local manager
            local actual_profile
            local failed=0

            if inventory="$(docker ps -aq \
              --filter "label=managed-by=minisky" \
              --filter "label=minisky.profile=${cleanup_profile}")"; then
              while IFS= read -r resource; do
                test -n "${resource}" || continue
                if ! manager="$(docker inspect --format '{{ index .Config.Labels "managed-by" }}' "${resource}")" ||
                  ! actual_profile="$(docker inspect --format '{{ index .Config.Labels "minisky.profile" }}' "${resource}")" ||
                  ! test "${manager}" = "minisky" ||
                  ! test "${actual_profile}" = "${cleanup_profile}" ||
                  ! docker rm -f -v "${resource}"; then
                  failed=1
                fi
              done <<<"${inventory}"
            else
              echo "Unable to inventory exact-owned containers for profile ${cleanup_profile}." >&2
              failed=1
            fi

            if inventory="$(docker network ls -q \
              --filter "label=managed-by=minisky" \
              --filter "label=minisky.profile=${cleanup_profile}")"; then
              while IFS= read -r resource; do
                test -n "${resource}" || continue
                if ! manager="$(docker network inspect --format '{{ index .Labels "managed-by" }}' "${resource}")" ||
                  ! actual_profile="$(docker network inspect --format '{{ index .Labels "minisky.profile" }}' "${resource}")" ||
                  ! test "${manager}" = "minisky" ||
                  ! test "${actual_profile}" = "${cleanup_profile}" ||
                  ! docker network rm "${resource}"; then
                  failed=1
                fi
              done <<<"${inventory}"
            else
              echo "Unable to inventory exact-owned networks for profile ${cleanup_profile}." >&2
              failed=1
            fi

            if inventory="$(docker volume ls -q \
              --filter "label=managed-by=minisky" \
              --filter "label=minisky.profile=${cleanup_profile}")"; then
              while IFS= read -r resource; do
                test -n "${resource}" || continue
                if ! manager="$(docker volume inspect --format '{{ index .Labels "managed-by" }}' "${resource}")" ||
                  ! actual_profile="$(docker volume inspect --format '{{ index .Labels "minisky.profile" }}' "${resource}")" ||
                  ! test "${manager}" = "minisky" ||
                  ! test "${actual_profile}" = "${cleanup_profile}" ||
                  ! docker volume rm "${resource}"; then
                  failed=1
                fi
              done <<<"${inventory}"
            else
              echo "Unable to inventory exact-owned volumes for profile ${cleanup_profile}." >&2
              failed=1
            fi

            if ! inventory="$(docker ps -aq \
              --filter "label=managed-by=minisky" \
              --filter "label=minisky.profile=${cleanup_profile}")"; then
              echo "Unable to verify exact-owned container cleanup for profile ${cleanup_profile}." >&2
              failed=1
            elif test -n "${inventory}"; then
              echo "Exact-owned containers remain after cleanup for profile ${cleanup_profile}: ${inventory}" >&2
              failed=1
            fi
            if ! inventory="$(docker network ls -q \
              --filter "label=managed-by=minisky" \
              --filter "label=minisky.profile=${cleanup_profile}")"; then
              echo "Unable to verify exact-owned network cleanup for profile ${cleanup_profile}." >&2
              failed=1
            elif test -n "${inventory}"; then
              echo "Exact-owned networks remain after cleanup for profile ${cleanup_profile}: ${inventory}" >&2
              failed=1
            fi
            if ! inventory="$(docker volume ls -q \
              --filter "label=managed-by=minisky" \
              --filter "label=minisky.profile=${cleanup_profile}")"; then
              echo "Unable to verify exact-owned volume cleanup for profile ${cleanup_profile}." >&2
              failed=1
            elif test -n "${inventory}"; then
              echo "Exact-owned volumes remain after cleanup for profile ${cleanup_profile}: ${inventory}" >&2
              failed=1
            fi

            return "${failed}"
          }
          {
            cleanup_failed=0
            for cleanup_profile in "${MINISKY_EMULATOR_BOUNDARY_PROFILE}" "${MINISKY_EMULATOR_BOUNDARY_PROFILE}-isolated"; do
              if ! cleanup_exact_profile "${cleanup_profile}"; then
                cleanup_failed=1
              fi
            done
            test "${cleanup_failed}" -eq 0
          } 2>&1 | tee critical-storage-persistence-pubsub-session-cleanup.log

      - name: Retain Storage and PubSub boundary diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: critical-storage-persistence-pubsub-session-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            critical-storage-persistence-pubsub-session.log
            critical-storage-persistence-pubsub-session-cleanup.log
            ${{ runner.temp }}/storage-persistence-pubsub-session-diagnostics
          if-no-files-found: error
          retention-days: 7

  memcache-integration:
    name: Critical Memcached SDK and Terraform lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI from lockfile
        working-directory: ui
        run: |
          npm ci
          npm run build

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.8"

      - name: Verify Docker availability
        run: docker info >/dev/null

      - name: Initialize pinned Memcached provider
        run: terraform -chdir=terraform/memcache init -backend=false -input=false -lockfile=readonly

      - name: Run hardened Memcached integration lifecycle
        run: |
          set -o pipefail
          make test-memcache-integration 2>&1 | tee critical-memcache-integration.log

      - name: Clean exact-owned Memcached resources
        if: always()
        timeout-minutes: 2
        run: |
          set -o pipefail
          {
            while IFS= read -r container; do
              test -z "${container}" && continue
              profile="$(docker inspect --format '{{ index .Config.Labels "minisky.profile" }}' "${container}")"
              if [[ "${profile}" == memcache-integration-* ]]; then
                docker rm -f -v "${container}"
              fi
            done < <(docker ps -aq \
              --filter "label=managed-by=minisky" \
              --filter "label=minisky.service=memorystore-memcached")

            if docker network inspect minisky-net >/dev/null 2>&1; then
              manager="$(docker network inspect --format '{{ index .Labels "managed-by" }}' minisky-net)"
              profile="$(docker network inspect --format '{{ index .Labels "minisky.profile" }}' minisky-net)"
              if [[ "${manager}" == "minisky" && "${profile}" == memcache-integration-* ]]; then
                docker network rm minisky-net
              fi
            fi

            rm -rf /tmp/minisky-memcache-integration.lock /tmp/minisky-net-integration.lock
          } 2>&1 | tee critical-memcache-cleanup.log

      - name: Capture Memcached failure diagnostics
        if: ${{ failure() || cancelled() }}
        run: |
          {
            printf 'run_sha=%s\n' '${{ github.sha }}'
            printf '%s\n' 'containers:'
            if ! docker ps -a --format '{{.ID}} {{.Image}} {{.Names}} {{.Labels}}' 2>/dev/null; then
              printf '%s\n' 'Docker container inventory unavailable.'
            fi
            printf '%s\n' 'networks:'
            if ! docker network ls 2>/dev/null; then
              printf '%s\n' 'Docker network inventory unavailable.'
            fi
            printf '%s\n' 'volumes:'
            if ! docker volume ls 2>/dev/null; then
              printf '%s\n' 'Docker volume inventory unavailable.'
            fi
          } >critical-memcache-diagnostics.txt

      - name: Retain Memcached failure diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: critical-memcache-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            critical-memcache-integration.log
            critical-memcache-cleanup.log
            critical-memcache-diagnostics.txt
          if-no-files-found: error
          retention-days: 7

  enterprise-controls:
    name: Critical Phase 17 enterprise controls
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: critical-integration-ui-dist
          path: ui/dist

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.8"

      - name: Verify Docker availability
        run: docker info >/dev/null

      - name: Run guarded enterprise controls lifecycle
        run: |
          set -o pipefail
          make test-phase17-enterprise 2>&1 | tee critical-phase17-enterprise.log

      - name: Retain failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: critical-phase17-enterprise-${{ github.run_id }}-${{ github.run_attempt }}
          path: critical-phase17-enterprise.log
          if-no-files-found: error
          retention-days: 7
