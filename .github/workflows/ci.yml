name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_terraform_integration:
        description: Run the Docker-backed Terraform acceptance stack
        required: false
        type: boolean
        default: false
      run_state_durability_integration:
        description: Run restart, export, and clean-import acceptance
        required: false
        type: boolean
        default: false
      run_phase15_emulator_integration:
        description: Run Firestore, Datastore, and Spanner SDK emulator acceptance
        required: false
        type: boolean
        default: false
      run_phase10_artifact_integration:
        description: Run Artifact Registry repository and Registry v2 acceptance
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Validate project agent skills
        run: python3 .claude/skills/validate.py

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Lint UI
        working-directory: ui
        run: npm run lint

      - name: Audit UI dependencies
        working-directory: ui
        run: npm audit --audit-level=high

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Share UI assets with native platform jobs
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd pkg ui)"

      - name: Vet Go code
        run: go vet ./cmd/... ./pkg/... ./ui

      - name: Test Go code with race detector
        run: go test -race ./cmd/... ./pkg/... ./ui

      - name: Build MiniSky
        run: go build -trimpath ./cmd/minisky

      - name: Validate local action JavaScript
        run: node --check .github/actions/setup-minisky/index.mjs && node --check .github/actions/setup-minisky/cleanup.mjs

      - name: Start built artifact with local action
        id: minisky
        uses: ./.github/actions/setup-minisky
        with:
          binary: ./minisky
          api-port: "18080"
          ui-port: "18081"
          profile: action-e2e
          services: compute

      - name: Verify action readiness output
        run: |
          test "${{ steps.minisky.outputs.endpoint }}" = "http://127.0.0.1:18080"
          curl --fail --silent --show-error "${{ steps.minisky.outputs.endpoint }}/healthz"

      - name: Validate CI and Compose templates
        env:
          MINISKY_IMAGE: ghcr.io/qamarudeenm/minisky:test
        run: |
          ruby -e "require 'yaml'; YAML.safe_load(File.read('.gitlab/ci/minisky.yml'), aliases: true)"
          docker compose -f deployments/docker-compose.yml config >/dev/null

  terraform-validate:
    name: Validate Terraform example
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize pinned providers
        working-directory: terraform
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        working-directory: terraform
        run: terraform validate

      - name: Validate integration script syntax
        run: bash -n scripts/terraform-integration.sh scripts/state-durability-integration.sh scripts/event-delivery-integration.sh scripts/phase10-artifact-integration.sh scripts/phase15-emulator-integration.sh scripts/linux-package-integration.sh scripts/airgap-bundle.sh scripts/airgap-bundle-test.sh

      - name: Verify air-gapped bundle workflow
        run: ./scripts/airgap-bundle-test.sh

  benchmarks:
    name: Record benchmark evidence
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run correctness-checked benchmarks
        run: |
          go test -run '^$' -bench BenchmarkGatewayRouting -benchmem -count=3 ./pkg/router | tee benchmark-router.txt
          go test -run '^$' -bench 'BenchmarkStore(Save|Load)' -benchmem -count=3 ./pkg/state | tee benchmark-state.txt
          go test -run '^$' -bench BenchmarkProjectMetadataLookup -benchmem -count=3 ./pkg/shims/metadata | tee benchmark-shim.txt

      - name: Upload raw benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-${{ github.sha }}
          path: benchmark-*.txt
          if-no-files-found: error

  sdk-smoke-validate:
    name: Compile SDK smoke suites
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sdk-smoke/python/requirements.txt

      - name: Install pinned Python SDK dependency
        run: python -m pip install --requirement sdk-smoke/python/requirements.txt

      - name: Compile Go SDK smoke
        run: go test ./sdk-smoke/go ./sdk-smoke/phase15

      - name: Compile Python SDK smoke
        run: python -m compileall -q sdk-smoke/python

  terraform-integration:
    name: Terraform apply, no-drift, and destroy
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.run_terraform_integration ||
      github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'terraform-integration')
    needs:
      - quality
      - sdk-smoke-validate
      - terraform-validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sdk-smoke/python/requirements.txt

      - name: Install pinned Python SDK dependency
        run: python -m pip install --requirement sdk-smoke/python/requirements.txt

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Run Terraform integration
        env:
          MINISKY_TERRAFORM_INTEGRATION: "1"
        run: ./scripts/terraform-integration.sh

  state-durability-integration:
    name: Terraform restart, export, and import
    if: github.event_name == 'workflow_dispatch' && inputs.run_state_durability_integration
    needs:
      - quality
      - terraform-validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ui-dist
          path: ui/dist

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.8"

      - name: Run state durability integration
        env:
          MINISKY_STATE_DURABILITY_INTEGRATION: "1"
        run: ./scripts/state-durability-integration.sh

  phase15-emulator-integration:
    name: Firestore, Datastore, and Spanner SDK acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.run_phase15_emulator_integration
    needs:
      - quality
      - sdk-smoke-validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ui-dist
          path: ui/dist

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run phase 15 emulator integration
        env:
          MINISKY_PHASE15_INTEGRATION: "1"
        run: bash scripts/phase15-emulator-integration.sh

  phase10-artifact-integration:
    name: Artifact Registry API and data-plane acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.run_phase10_artifact_integration
    needs:
      - quality
      - terraform-validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ui-dist
          path: ui/dist

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run Phase-10 Artifact Registry integration
        env:
          MINISKY_PHASE10_INTEGRATION: "1"
        run: bash scripts/phase10-artifact-integration.sh

  release-snapshot:
    name: Validate release configuration
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: goreleaser/goreleaser-action@v6
        name: Validate GoReleaser configuration
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - uses: goreleaser/goreleaser-action@v6
        name: Build Linux amd64 release snapshot
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean --id linux-amd64

  linux-packages:
    name: Install Linux packages (${{ matrix.name }})
    needs: quality
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            expected_arch: x86_64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            expected_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ui-dist
          path: ui/dist

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify native Linux architecture
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = "${{ matrix.expected_arch }}"

      - name: Install rpm inspection and package tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm

      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      - name: Build, install, smoke-test, and remove deb/rpm
        env:
          MINISKY_LINUX_PACKAGE_INTEGRATION: "1"
        run: ./scripts/linux-package-integration.sh

  native-cgo:
    name: DuckDB conformance (${{ matrix.name }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            expected_arch: aarch64
            cc: gcc
          - name: macos-arm64
            runner: macos-14
            expected_arch: arm64
            cc: clang
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.expected_arch }}"

      - name: Run DuckDB conformance suite
        env:
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: go test -count=1 ./pkg/shims/bigquery

      - name: Build native MiniSky binary
        env:
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: go build -trimpath -o minisky ./cmd/minisky

      - name: Smoke test native binary
        run: ./minisky doctor bigquery

  windows-cgo:
    name: DuckDB conformance (windows-amd64)
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: ui/dist

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add UCRT toolchain to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH 'C:\msys64\ucrt64\bin'

      - name: Run DuckDB conformance suite
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: go test -count=1 ./pkg/shims/bigquery

      - name: Build native MiniSky binary
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: go build -trimpath -o minisky.exe ./cmd/minisky

      - name: Audit runtime DLL dependencies
        shell: pwsh
        run: |
          $dependencies = & objdump -p minisky.exe |
            Select-String 'DLL Name' |
            ForEach-Object { $_.Line.Trim() }
          $dependencies | Tee-Object -FilePath windows-dll-dependencies.txt
          if ($dependencies -match 'libgcc|libstdc\+\+|libwinpthread') {
            throw 'MiniSky requires non-system MinGW runtime DLLs'
          }

      - name: Smoke test native binary
        shell: pwsh
        run: .\minisky.exe version

      - name: Upload feasibility evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-cgo-evidence
          path: |
            minisky.exe
            windows-dll-dependencies.txt
          if-no-files-found: warn
