name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_phase12_observability_integration:
        description: On manual dispatch, run required Phase 12 loopback observability acceptance
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate project agent skills
        run: python3 .claude/skills/validate.py

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Lint UI
        working-directory: ui
        run: npm run lint

      - name: Test UI
        working-directory: ui
        run: npm test

      - name: Audit UI dependencies
        working-directory: ui
        run: npm audit --audit-level=high

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Share UI assets with native platform jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ui-dist
          path: ui/dist
          if-no-files-found: error

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Check generated documentation truth
        run: make check-docs-truth

      - name: Check Go formatting
        run: test -z "$(gofmt -l cmd pkg ui)"

      - name: Vet Go code
        run: go vet ./cmd/... ./pkg/... ./ui

      - name: Test Go code with race detector
        run: go test -race ./cmd/... ./pkg/... ./ui

      - name: Test integration script contracts
        run: go test -count=1 ./scripts

      - name: Build MiniSky
        run: go build -trimpath ./cmd/minisky

      - name: Validate local action JavaScript
        run: node --test .github/actions/setup-minisky/index.test.mjs && node --check .github/actions/setup-minisky/index.mjs && node --check .github/actions/setup-minisky/cleanup.mjs

      - name: Start built artifact with local action
        id: minisky
        uses: ./.github/actions/setup-minisky
        with:
          binary: ./minisky
          api-port: "18080"
          ui-port: "18081"
          profile: action-e2e
          services: compute

      - name: Verify action readiness output
        run: |
          test "${{ steps.minisky.outputs.endpoint }}" = "http://127.0.0.1:18080"
          curl --fail --silent --show-error "${{ steps.minisky.outputs.endpoint }}/healthz"

      - name: Validate CI and Compose templates
        env:
          MINISKY_IMAGE: ghcr.io/qamarudeenm/minisky:test
        run: |
          ruby -e "require 'yaml'; YAML.safe_load(File.read('.gitlab/ci/minisky.yml'), aliases: true)"
          docker compose -f deployments/docker-compose.yml config >/dev/null

  dependency-scan:
    name: Scan Go dependencies
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ui-dist
          path: ui/dist

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Scan reachable Go vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./cmd/... ./pkg/... ./ui

  terraform-validate:
    name: Validate Terraform example
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.8"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize pinned providers
        working-directory: terraform
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate Terraform configuration
        working-directory: terraform
        run: terraform validate

      - name: Validate integration script syntax
        run: |
          bash -n scripts/terraform-integration.sh scripts/state-durability-integration.sh scripts/kind-integration.sh scripts/release-tag-policy.sh scripts/event-delivery-integration.sh scripts/install-pack.sh scripts/phase10-artifact-integration.sh scripts/phase11-distribution-test.sh scripts/phase12-observability-integration.sh scripts/phase12-observability-integration-test.sh scripts/phase13-wif-integration.sh scripts/phase17-enterprise-wif-integration.sh scripts/phase15-emulator-integration.sh scripts/phase16-monitoring-integration.sh scripts/phase16-logging-integration.sh scripts/phase16-dns-integration.sh scripts/phase16-subnetwork-integration.sh scripts/phase16-subnetwork-terraform-integration.sh scripts/phase16-vertex-integration.sh scripts/phase18-25-sdk-integration.sh scripts/phase18-eventarc-terraform-integration.sh scripts/phase18-workflows-terraform-integration.sh scripts/phase19-composer-terraform-integration.sh scripts/phase19-managed-kafka-terraform-integration.sh scripts/phase19-sdk-integration.sh scripts/phase20-alloydb-terraform-integration.sh scripts/phase20-filestore-terraform-integration.sh scripts/phase20-identity-platform-terraform-integration.sh scripts/phase20-storage-transfer-terraform-integration.sh scripts/phase20-sdk-integration.sh scripts/phase21-22-sdk-integration.sh scripts/phase21-service-directory-terraform-integration.sh scripts/phase23-document-ai-terraform-integration.sh scripts/phase23-sdk-integration.sh scripts/phase24-25-sdk-integration.sh scripts/phase24-org-policy-terraform-integration.sh scripts/phase25-binary-authorization-terraform-integration.sh scripts/linux-package-integration.sh scripts/airgap-bundle.sh scripts/airgap-bundle-test.sh
          ./scripts/phase11-distribution-test.sh --self-test
          make test-phase12-observability-contract
          MINISKY_KIND_SELF_TEST=1 ./scripts/kind-integration.sh
          MINISKY_RELEASE_TAG_POLICY_SELF_TEST=1 ./scripts/release-tag-policy.sh
          MINISKY_PHASE16_SUBNETWORK_SELF_TEST=1 ./scripts/phase16-subnetwork-integration.sh
          MINISKY_PHASE16_SUBNETWORK_TERRAFORM_SELF_TEST=1 ./scripts/phase16-subnetwork-terraform-integration.sh
          set +e
          env -u MINISKY_PHASE19_SDK_INTEGRATION ./scripts/phase19-sdk-integration.sh >phase19-refusal.log 2>&1
          phase19_refusal_status=$?
          set -e
          test "${phase19_refusal_status}" -eq 2
          grep -F "Refusing Phase 19 SDK integration" phase19-refusal.log >/dev/null
          rm phase19-refusal.log
          set +e
          env -u MINISKY_PHASE20_SDK_INTEGRATION ./scripts/phase20-sdk-integration.sh >phase20-refusal.log 2>&1
          phase20_refusal_status=$?
          set -e
          test "${phase20_refusal_status}" -eq 2
          grep -F "Refusing Phase 20 SDK integration" phase20-refusal.log >/dev/null
          rm phase20-refusal.log
          set +e
          env -u MINISKY_PHASE21_22_SDK_INTEGRATION ./scripts/phase21-22-sdk-integration.sh >phase21-22-refusal.log 2>&1
          phase21_22_refusal_status=$?
          set -e
          test "${phase21_22_refusal_status}" -eq 2
          grep -F "Refusing Phase 21-22 SDK integration" phase21-22-refusal.log >/dev/null
          rm phase21-22-refusal.log
          set +e
          env -u MINISKY_PHASE23_SDK_INTEGRATION ./scripts/phase23-sdk-integration.sh >phase23-refusal.log 2>&1
          phase23_refusal_status=$?
          set -e
          test "${phase23_refusal_status}" -eq 2
          grep -F "Refusing Phase 23 SDK integration" phase23-refusal.log >/dev/null
          rm phase23-refusal.log
          set +e
          env -u MINISKY_PHASE24_25_SDK_INTEGRATION ./scripts/phase24-25-sdk-integration.sh >phase24-25-refusal.log 2>&1
          phase24_25_refusal_status=$?
          set -e
          test "${phase24_25_refusal_status}" -eq 2
          grep -F "Refusing Phase 24-25 SDK integration" phase24-25-refusal.log >/dev/null
          rm phase24-25-refusal.log

      - name: Validate Memcached integration script
        run: |
          bash -n scripts/memcache-integration.sh
          shellcheck scripts/memcache-integration.sh

      - name: Verify air-gapped bundle workflow
        run: ./scripts/airgap-bundle-test.sh

  benchmarks:
    name: Record benchmark evidence
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run correctness-checked benchmarks
        run: |
          go test -run '^$' -bench BenchmarkGatewayRouting -benchmem -count=3 ./pkg/router | tee benchmark-router.txt
          go test -run '^$' -bench 'BenchmarkStore(Save|Load)' -benchmem -count=3 ./pkg/state | tee benchmark-state.txt
          go test -run '^$' -bench BenchmarkProjectMetadataLookup -benchmem -count=3 ./pkg/shims/metadata | tee benchmark-shim.txt

      - name: Upload raw benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-${{ github.sha }}
          path: benchmark-*.txt
          if-no-files-found: error

  sdk-smoke-validate:
    name: Compile SDK smoke suites
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sdk-smoke/python/requirements.txt

      - name: Install pinned Python SDK dependency
        run: python -m pip install --requirement sdk-smoke/python/requirements.txt

      - name: Compile Go SDK smoke
        run: go test ./sdk-smoke/go ./sdk-smoke/phase15 ./sdk-smoke/phase16 ./sdk-smoke/phase16-logging ./sdk-smoke/phase16-dns ./sdk-smoke/phase16-subnetwork ./sdk-smoke/phase16-vertex ./sdk-smoke/phase18-25 ./sdk-smoke/phase19 ./sdk-smoke/phase20 ./sdk-smoke/phase21-22 ./sdk-smoke/phase23 ./sdk-smoke/phase24-25

      - name: Compile Python SDK smoke
        run: python -m compileall -q sdk-smoke/python

      - name: Compile Java SDK smoke in pinned container
        run: make test-java-sdk-compile

  phase18-25-evidence:
    name: Phase 18-25 offline evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run Phase 18-25 offline evidence
        run: make test-phase18-25-evidence

  phase12-observability-integration:
    name: Phase 12 loopback observability acceptance
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' && inputs.run_phase12_observability_integration
    needs: quality
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ui-dist
          path: ui/dist

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run Phase 12 observability integration
        env:
          MINISKY_PHASE12_DIAGNOSTICS_DIR: ${{ runner.temp }}/phase12-observability-diagnostics
        run: |
          mkdir -p "${MINISKY_PHASE12_DIAGNOSTICS_DIR}"
          if ! make test-phase12-observability; then
            printf '%s\n' 'Phase 12 acceptance failed; inspect the bounded sanitized diagnostics.' \
              >"${MINISKY_PHASE12_DIAGNOSTICS_DIR}/ci-summary.txt"
            exit 1
          fi

      - name: Retain Phase 12 failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: phase12-observability-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/phase12-observability-diagnostics
          if-no-files-found: error
          retention-days: 7

  release-snapshot:
    name: Validate release configuration
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        name: Install pinned GoReleaser
        with:
          distribution: goreleaser
          version: v2.17.0
          install-only: true

      - name: Validate non-publishing Phase 11 distribution contracts
        env:
          MINISKY_PHASE11_DISTRIBUTION_BUILD: "0"
        run: make test-phase11-distribution

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        name: Build Linux amd64 release snapshot
        with:
          distribution: goreleaser
          version: v2.17.0
          args: build --snapshot --clean --id linux-amd64

  linux-packages:
    name: Install Linux packages (${{ matrix.name }})
    needs: quality
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-latest
            expected_arch: x86_64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            expected_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ui-dist
          path: ui/dist

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify native Linux architecture
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = "${{ matrix.expected_arch }}"

      - name: Install rpm inspection and package tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes rpm

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          install-only: true

      - name: Build, install, smoke-test, and remove deb/rpm
        env:
          MINISKY_LINUX_PACKAGE_INTEGRATION: "1"
        run: ./scripts/linux-package-integration.sh

  native-cgo:
    name: DuckDB conformance (${{ matrix.name }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            expected_arch: aarch64
            cc: gcc
          - name: macos-arm64
            runner: macos-14
            expected_arch: arm64
            cc: clang
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ui-dist
          path: ui/dist

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.expected_arch }}"

      - name: Run DuckDB conformance suite
        env:
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: go test -count=1 ./pkg/shims/bigquery

      - name: Build native MiniSky binary
        env:
          CGO_ENABLED: "1"
          CC: ${{ matrix.cc }}
        run: go build -trimpath -o minisky ./cmd/minisky

      - name: Smoke test native binary
        run: ./minisky doctor bigquery

  windows-cgo:
    name: DuckDB conformance (windows-amd64)
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ui-dist
          path: ui/dist

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add UCRT toolchain to PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH 'C:\msys64\ucrt64\bin'

      - name: Run DuckDB conformance suite
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: go test -count=1 ./pkg/shims/bigquery

      - name: Build native MiniSky binary
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CC: gcc
        run: go build -trimpath -o minisky.exe ./cmd/minisky

      - name: Audit runtime DLL dependencies
        shell: pwsh
        run: |
          $dependencies = & objdump -p minisky.exe |
            Select-String 'DLL Name' |
            ForEach-Object { $_.Line.Trim() }
          $dependencies | Tee-Object -FilePath windows-dll-dependencies.txt
          if ($dependencies -match 'libgcc|libstdc\+\+|libwinpthread') {
            throw 'MiniSky requires non-system MinGW runtime DLLs'
          }

      - name: Smoke test native binary
        shell: pwsh
        run: .\minisky.exe version

      - name: Upload feasibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-cgo-evidence
          path: |
            minisky.exe
            windows-dll-dependencies.txt
          if-no-files-found: warn
