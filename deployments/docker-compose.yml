services:
  minisky:
    image: "${MINISKY_IMAGE:?set MINISKY_IMAGE to a verified MiniSky image tag or digest}"
    environment:
      HOME: /var/lib/minisky
      MINISKY_PORT: "8080"
      MINISKY_UI_PORT: "8081"
      MINISKY_PROFILE: "${MINISKY_PROFILE:-compose}"
      MINISKY_SERVICES: "${MINISKY_SERVICES:-compute,storage,pubsub}"
      MINISKY_RUNTIME_PROFILE: "${MINISKY_RUNTIME_PROFILE:-simulation}"
      MINISKY_STATE_DIR: /var/lib/minisky/state
    ports:
      - "127.0.0.1:${MINISKY_PORT:-18080}:8080"
      - "127.0.0.1:${MINISKY_UI_PORT:-18081}:8081"
    volumes:
      - minisky-state:/var/lib/minisky
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /tmp
    stop_grace_period: 10s

volumes:
  minisky-state:
