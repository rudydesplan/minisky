# .goreleaser.yaml
version: 2

project_name: minisky

before:
  hooks:
    - go mod download
    - bash -c "cd ui && npm ci && npm run build"

builds:
  - id: linux-amd64
    main: ./cmd/minisky
    binary: minisky
    skip: '{{ and (ne (index .Env "MINISKY_GORELEASER_TARGET") "") (ne (index .Env "MINISKY_GORELEASER_TARGET") "linux-amd64") }}'
    env: [CGO_ENABLED=1]
    goos: [linux]
    goarch: [amd64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X minisky/pkg/version.Version={{ .Version }}

  - id: linux-arm64
    main: ./cmd/minisky
    binary: minisky
    skip: '{{ and (ne (index .Env "MINISKY_GORELEASER_TARGET") "") (ne (index .Env "MINISKY_GORELEASER_TARGET") "linux-arm64") }}'
    env: [CGO_ENABLED=1]
    goos: [linux]
    goarch: [arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X minisky/pkg/version.Version={{ .Version }}

  - id: darwin-arm64
    main: ./cmd/minisky
    binary: minisky
    skip: '{{ and (ne (index .Env "MINISKY_GORELEASER_TARGET") "") (ne (index .Env "MINISKY_GORELEASER_TARGET") "darwin-arm64") }}'
    env:
      - CGO_ENABLED=1
      - CC=clang
    goos: [darwin]
    goarch: [arm64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X minisky/pkg/version.Version={{ .Version }}

  - id: windows-amd64
    main: ./cmd/minisky
    binary: minisky
    skip: '{{ and (ne (index .Env "MINISKY_GORELEASER_TARGET") "") (ne (index .Env "MINISKY_GORELEASER_TARGET") "windows-amd64") }}'
    env:
      - CGO_ENABLED=1
      - CC=gcc
    goos: [windows]
    goarch: [amd64]
    flags: [-trimpath]
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X minisky/pkg/version.Version={{ .Version }}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - CONTRIBUTING.md
      - docs/*
      - LICENSE*

scoops:
  - name: minisky
    repository:
      owner: qamarudeenm
      name: scoop-bucket
    homepage: https://github.com/qamarudeenm/minisky
    description: High-fidelity local GCP emulator.
    license: MIT

nfpms:
  - id: minisky-pkg
    ids:
      - linux-amd64
      - linux-arm64
    package_name: minisky
    vendor: MiniSky Open Source
    homepage: https://github.com/qamarudeenm/minisky
    maintainer: MiniSky Team <maintainers@minisky.dev>
    description: High-fidelity local GCP emulator.
    license: MIT
    formats:
      - deb
      - rpm

homebrew_casks:
  - name: minisky
    repository:
      owner: qamarudeenm
      name: homebrew-tap
    homepage: https://github.com/qamarudeenm/minisky
    description: High-fidelity local GCP emulator.
    license: MIT
    binaries:
      - minisky

checksum:
  name_template: 'checksums.txt'

release:
  github:
    owner: qamarudeenm
    name: minisky
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## MiniSky {{ .Tag }}
    This release includes critical bug fixes and documentation updates.
  footer: |
    **Full Changelog**: https://github.com/qamarudeenm/minisky/compare/{{ .PreviousTag }}...{{ .Tag }}

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
